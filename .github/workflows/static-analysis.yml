name: Static analysis

# detekt runs on every pull request in `quality.yml`; this workflow repeats it for the commit the
# owner approved with `/reviewed` and publishes the result as the `static-analysis` status on that
# commit, so branch protection can require it next to `owner-review`.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

# A repeated review command waits for the running analysis instead of cancelling it, so a
# required status is never left pending.
concurrency:
  group: static-analysis-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  detekt:
    if: >-
      github.ref == 'refs/heads/master' &&
      github.event.issue.pull_request &&
      github.event.comment.user.id == github.event.repository.owner.id &&
      (startsWith(github.event.comment.body, '/reviewed') ||
       startsWith(github.event.comment.body, '/revied'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          persist-credentials: false
      - name: Record the reviewed commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish the pending status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=pending -f context=static-analysis \
            -f description="detekt is running" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: jetbrains
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Run detekt
        run: ./gradlew detektAll --no-daemon
      - name: Publish the result
        if: always() && steps.sha.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
          OUTCOME: ${{ job.status }}
        run: |
          if [ "$OUTCOME" = success ]; then
            state=success
            description="detekt passed"
          else
            state=failure
            description="detekt failed"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" -f context=static-analysis \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
