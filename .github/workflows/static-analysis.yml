name: Static analysis

# Project policy: every CI gate runs only for a commit the owner approved with `/reviewed`.
# This workflow runs the two source-level gates and publishes `static-analysis` and
# `architecture-check` statuses; `cross-platform.yml` runs the Apple/Linux native checks for the
# same reviewed commit. Branch protection can require these statuses next to `owner-review`.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  gates:
    if: >-
      github.ref == 'refs/heads/master' &&
      github.event.issue.pull_request &&
      github.event.comment.user.id == github.event.repository.owner.id &&
      (github.event.comment.body == '/reviewed' ||
       startsWith(github.event.comment.body, '/reviewed ') ||
       github.event.comment.body == '/revied' ||
       startsWith(github.event.comment.body, '/revied '))
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      statuses: write
    # A repeated review command waits for the running analysis instead of cancelling it, so a
    # required status is never left pending. Each gate has its own group.
    concurrency:
      group: ${{ matrix.name }}-${{ github.event.issue.number }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: static-analysis
            task: detektAll
            description: detekt
          - name: architecture-check
            task: architectureCheck
            description: architecture
    steps:
      - name: Parse the review command
        # The `if` above accepts only '/reviewed' and '/reviewed <argument>'; this step rejects a
        # multi-line comment and any other argument shape, so a command is never guessed.
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          review_command="$(printf '%s' "$BODY" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [[ "$review_command" == *$'\n'* || ! "$review_command" =~ ^/(reviewed|revied)([[:space:]]+.+)?$ ]]; then
            echo "::error::Expected one line: /reviewed or /reviewed <SHA or link>."
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          persist-credentials: false
      - name: Record the reviewed commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish the pending status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
          CONTEXT: ${{ matrix.name }}
          DESCRIPTION: ${{ matrix.description }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=pending -f context="$CONTEXT" \
            -f description="$DESCRIPTION is running" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        env:
          # setup-java reads GITHUB_TOKEN for the JetBrains distribution API. Without it the
          # calls are anonymous and hit the GitHub API rate limit on shared runners.
          GITHUB_TOKEN: ${{ github.token }}
        with:
          distribution: jetbrains
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Run the gate
        env:
          GRADLE_TASK: ${{ matrix.task }}
        run: ./gradlew "$GRADLE_TASK" --no-daemon
      - name: Publish the result
        if: always() && steps.sha.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
          CONTEXT: ${{ matrix.name }}
          DESCRIPTION: ${{ matrix.description }}
          OUTCOME: ${{ job.status }}
        run: |
          if [ "$OUTCOME" = success ]; then
            state=success
            description="$DESCRIPTION passed"
          else
            state=failure
            description="$DESCRIPTION failed"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" -f context="$CONTEXT" \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
