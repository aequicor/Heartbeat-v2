name: Owner review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  # The review result is a comment on a pull request. For pull request resources the
  # issue comment endpoints require the pull requests permission, not the issues one.
  issues: write
  pull-requests: write

jobs:
  approve:
    if: >-
      github.ref == 'refs/heads/master' &&
      github.event.issue.pull_request &&
      github.event.comment.user.id == github.event.repository.owner.id &&
      (github.event.comment.body == '/reviewed' ||
       startsWith(github.event.comment.body, '/reviewed ') ||
       github.event.comment.body == '/revied' ||
       startsWith(github.event.comment.body, '/revied '))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: owner-review
    concurrency:
      group: owner-review-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      # issue_comment runs from the default branch. Never check out the PR.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Acknowledge the review command
        run: python .github/scripts/owner_review.py acknowledge
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Validate the owner comment and current PR
        id: validate
        run: python .github/scripts/owner_review.py validate
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Create a repository-scoped review token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.OWNER_REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.OWNER_REVIEW_APP_PRIVATE_KEY }}
      - name: Approve and publish the status for the reviewed SHA
        id: publish
        run: python .github/scripts/owner_review.py approve
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_REVIEW_WRITE_TOKEN: ${{ steps.app.outputs.token }}
      - name: Request squash merge for the reviewed SHA
        id: merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_PROMPT_DISABLED: '1'
          PR_NUMBER: ${{ github.event.issue.number }}
          REVIEWED_SHA: ${{ steps.publish.outputs.reviewed_sha }}
        run: |
          test -n "$REVIEWED_SHA"
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$REVIEWED_SHA"
      - name: Reply with the review result
        if: ${{ !cancelled() }}
        run: python .github/scripts/owner_review.py feedback
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_OUTCOME: ${{ steps.publish.outcome }}
          MERGE_OUTCOME: ${{ steps.merge.outcome }}
          REVIEW_ERROR: ${{ steps.validate.outputs.error || steps.publish.outputs.error }}
          APP_OUTCOME: ${{ steps.app.outcome }}
