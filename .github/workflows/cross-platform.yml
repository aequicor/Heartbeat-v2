name: Cross-platform checks

# Project policy: every CI gate runs only for a commit the owner approved with `/reviewed`.
# Apple targets and Linux native tests cannot run on the Windows host, so this workflow
# validates them on the matching runners for the reviewed commit, next to the source-level
# gates in `static-analysis.yml`. Platform entry points stay on demand in `verify-platform.yml`.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  linux-native:
    name: linux-native
    if: >-
      github.ref == 'refs/heads/master' &&
      github.event.issue.pull_request &&
      github.event.comment.user.id == github.event.repository.owner.id &&
      (startsWith(github.event.comment.body, '/reviewed') ||
       startsWith(github.event.comment.body, '/revied'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: jetbrains
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Run Linux native tests
        # Bare task name: Gradle runs linuxX64Test in every module that declares the target
        # (universal and Decompose modules), so new modules are covered without editing the list.
        run: >-
          ./gradlew
          linuxX64Test
          --no-daemon

  apple-native:
    name: apple-native
    if: >-
      github.ref == 'refs/heads/master' &&
      github.event.issue.pull_request &&
      github.event.comment.user.id == github.event.repository.owner.id &&
      (startsWith(github.event.comment.body, '/reviewed') ||
       startsWith(github.event.comment.body, '/revied'))
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: jetbrains
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Compile Apple targets and run macOS tests
        # Bare task names: Gradle compiles each Apple target and runs macOS tests in every module
        # that declares it (universal and Decompose modules), so the matrix stays complete without
        # a hand-maintained module list.
        run: >-
          ./gradlew
          compileKotlinMacosArm64
          compileKotlinMacosX64
          compileKotlinIosArm64
          compileKotlinIosSimulatorArm64
          compileKotlinIosX64
          macosArm64Test
          --no-daemon
