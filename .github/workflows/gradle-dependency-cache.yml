name: Warm Gradle dependency cache

on:
  push:
    branches: [master]
    paths:
      - '**/*.gradle.kts'
      - '**/gradle.properties'
      - 'gradle/**'
      - '.github/actions/restore-gradle-dependencies/**'
      - '.github/workflows/gradle-dependency-cache.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warm:
    if: github.ref == 'refs/heads/master'
    name: Warm dependencies on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        runner: [ubuntu-24.04, windows-latest, macos-15]
    concurrency:
      group: gradle-dependency-cache-${{ matrix.runner }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - id: dependencies
        uses: ./.github/actions/restore-gradle-dependencies
        with:
          warm-up: 'true'
      - if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          distribution: jetbrains
          java-version: '25'
      - name: Resolve build scripts and buildSrc dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        shell: bash
        env:
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle/ci-dependency-cache
        run: ./gradlew help --no-daemon --console=plain
      - name: Save the shared dependency cache
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .gradle/ci-dependency-cache/caches/modules-2/files-*
            .gradle/ci-dependency-cache/caches/modules-2/metadata-*
            .gradle/ci-dependency-cache/caches/modules-2/resources-*
          key: ${{ steps.dependencies.outputs.cache-key }}
